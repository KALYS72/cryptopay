# Деплой на любой облачный VPS (DigitalOcean, Hetzner, Azure for Students, Yandex Cloud…):
#   1. Установите Docker на сервер.
#   2. Скопируйте проект, создайте deploy/.env (см. ниже) и выполните:
#        docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#   3. Caddy сам получит HTTPS-сертификат Let's Encrypt для DOMAIN.
#
# deploy/.env:
#   DOMAIN=203-0-113-10.sslip.io     # нет своего домена? sslip.io превращает IP в домен
#   JWT_SECRET=<python -c "import secrets; print(secrets.token_hex(32))">
#   POSTGRES_PASSWORD=<любой длинный пароль>
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryptopay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: cryptopay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryptopay -d cryptopay']
      interval: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    environment:
      APP_ENV: production
      PUBLIC_URL: https://${DOMAIN:?задайте DOMAIN}
      DATABASE_URL: postgresql://cryptopay:${POSTGRES_PASSWORD}@db:5432/cryptopay
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
