[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopay"
version = "2.0.0"
description = "CryptoPay — платёжная система в стиле Stripe с интеграцией криптокошелька (имитация MockWallet)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.11",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "PyJWT>=2.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "playwright>=1.55",
    "mypy>=1.18",
    "ruff>=0.13",
]

[project.scripts]
cryptopay = "cryptopay.main:run"

[tool.setuptools.packages.find]
include = ["cryptopay*"]

# ─────────────────────────────── тесты ───────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "e2e: сквозные тесты в браузере (нужен Chromium: playwright install chromium)",
]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
]

# ───────────────────────────── линтер ─────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
# Фрагменты кода в документации иллюстративные (с выравненными комментариями) — их не форматируем.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — это не опечатка
    "N815",                         # camelCase в DTO: это формат JSON внешнего API
    "S101",                         # assert в тестах
    "S104",                         # 0.0.0.0 в контейнере — так и задумано
    "UP046", "UP047",               # TypeVar вместо синтаксиса PEP 695: так понятнее тем, кто знает Python 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "E501"]
"scripts/**" = ["S603", "S607", "S310"]
"examples/**" = ["S310", "E501"]

# ─────────────────────────── проверка типов ───────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["cryptopay"]
