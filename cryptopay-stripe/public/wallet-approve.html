<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подтверждение платежа — MockWallet</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#262c36">
  <link rel="icon" href="/assets/img/mockwallet.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/golos-text-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/wallet.css">
  <script type="module" src="/assets/js/wallet-approve.js"></script>
</head>
<body class="wallet-page">
  <p class="wallet-disclaimer">Это имитация криптокошелька для тестового режима CryptoPay. Настоящие деньги не используются.</p>

  <main class="device" aria-labelledby="device-title">
    <header class="device-head">
      <span class="device-brand"><img src="/assets/img/mockwallet.svg" alt="" width="22" height="22">MockWallet</span>
      <a class="network" href="/wallet" target="_blank" rel="noopener">
        <span class="network-dot" aria-hidden="true"></span>MockChain <span class="num" id="height"></span>
      </a>
    </header>

    <div class="screen" id="screen-loading">
      <p class="dim">Загружаем запрос…</p>
    </div>

    <form class="screen" id="screen-request" hidden novalidate>
      <h1 id="device-title" class="request-title">Запрос на оплату</h1>
      <p class="request-merchant" id="merchant"></p>
      <p class="request-via dim small">через платёжную систему CryptoPay</p>
      <p class="request-amount num" id="amount"></p>
      <p class="request-description" id="description"></p>
      <dl class="request-meta small">
        <div><dt>Получатель</dt><dd class="mono" id="recipient"></dd></div>
        <div><dt>Комиссия сети</dt><dd>0 — тестовая сеть</dd></div>
      </dl>

      <fieldset class="accounts">
        <legend>Списать с кошелька</legend>
        <div id="accounts"></div>
      </fieldset>

      <div class="hw-buttons">
        <button type="button" class="hw-button hw-button--reject" id="reject">Отклонить</button>
        <button type="submit" class="hw-button hw-button--approve" id="approve">Подтвердить</button>
      </div>
      <p class="dim small request-expiry" id="expiry"></p>
    </form>

    <div class="screen screen--result" id="screen-result" hidden>
      <p class="result-mark" id="result-mark" aria-hidden="true"></p>
      <h1 class="result-title" id="result-title"></h1>
      <p class="dim" id="result-text"></p>
      <p class="mono small" id="result-tx"></p>
      <a class="hw-button hw-button--approve result-back" id="result-back" href="/">Вернуться в магазин</a>
    </div>
  </main>
</body>
</html>
