# Непрерывная интеграция: на каждый push и pull request
# проверяются стиль и типы, гоняются все тесты (в том числе на PostgreSQL и в браузере)
# и собирается Docker-образ.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cryptopay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cryptopay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Зависимости
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Стиль кода (ruff)
        run: ruff check . && ruff format --check .
      - name: Проверка типов (mypy --strict)
        run: mypy
      - name: Unit, архитектурные, контрактные (память + PostgreSQL) и интеграционные тесты
        run: pytest
      - name: Браузер для сквозных тестов
        run: playwright install --with-deps chromium
      - name: Сквозные тесты в браузере (сервер на PostgreSQL)
        run: pytest tests/e2e
        env:
          RUN_E2E: '1'
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cryptopay_test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка Docker-образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cryptopay:ci
